# test case for consent violation vs unrealization.
# So we need 1 unrealized AU, 1 violated AU in the same simulation.
# UNREALIZED: AU expires
# VIOLATED: If the action is taken before detachment or after expiration.
# We should check if it is collected properly as well.

# Check if agent4 can wait for the egg to be released in 2 steps by Agent2
# If Agent1's consents, AUs, COs, get violated/expired
# If Agent4's consents, AUs, COs, get fulfilled.
# Use this one with default expiry step = 2
agents:
  - id: 1
    persona: GoalFirstAgent
    goals:
      - name: make_cake
        sub_goals: ["use_oven", "use_egg", "use_flour", "use_sugar"]
      - name: make_egg
        sub_goals: ["use_egg"]
      - name: make_my_egg
        sub_goals: ["use_egg"]
      - name: make_your_egg
        sub_goals: ["use_egg"]
    resources:
      - name: tomato_1
        type: tomato
      - name: zucchini_1
        type: zucchini
      - name: garlic_1
        type: garlic
      - name: onion_1
        type: onion
      - name: flour_1
        type: flour
      - name: oven_1
        type: oven

  - id: 2
    persona: GoalFirstAgent
    goals: 
      - name: make_garlic
        sub_goals: ["use_garlic"]
      - name: make_egg
        sub_goals: ["use_egg"]
      - name: make_spinach
        sub_goals: ["use_spinach"]
    resources:
      - name: egg_2
        type: egg

  - id: 3
    persona: GoalFirstAgent
    goals: 
    resources:
      - name: spinach_3
        type: spinach

  - id: 4
    persona: GoalFirstAgent
    goals:
      - name: make_flour
        sub_goals: ["use_flour"]
    resources:
      - name: garlic_4
        type: garlic